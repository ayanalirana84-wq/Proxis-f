<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Proxineon AI</title>
  
  <!-- Favicon / Web App Icon -->
  <link rel="icon" type="image/png" href="ai_icon.png" />
  <link rel="apple-touch-icon" href="ai_icon.png" />
  
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Highlight.js for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
    
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #ececec;
      height: 100dvh;
      overflow: hidden;
    }

    .composer-bg {
      background-color: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer-bg:focus-within {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg-animate {
      animation: msgIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Code Container & Block Styling */
    .code-container {
      position: relative;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    pre code.hljs {
      font-family: 'Fira Code', monospace !important;
      font-size: 0.82rem;
      padding: 1rem 1.25rem;
      background: #141414 !important;
      overflow-x: auto;
    }

    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.7rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Custom Prose & Markdown Elements */
    .selectable-text { user-select: text; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .ai-dp {
      object-fit: cover;
      border-radius: 9999px;
    }

    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body class="flex flex-col antialiased bg-[#0d0d0d]">

  <!-- Top App Navigation -->
  <header class="h-14 px-4 sticky top-0 z-30 flex items-center justify-between border-b border-white/[0.08] bg-[#0d0d0d]/85 backdrop-blur-xl shrink-0">
    <div class="flex items-center gap-2.5">
      <img src="ai_icon.png" alt="Proxineon AI" class="w-8 h-8 ai-dp border border-white/10 shadow-sm shrink-0" onError="this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'" />
      <div class="flex items-center gap-1.5">
        <h1 class="font-semibold text-sm tracking-tight text-white">Proxineon AI</h1>
        <span class="text-[10px] font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">120B</span>
      </div>
    </div>

    <div class="flex items-center gap-1">
      <button id="clearChatBtn" title="New Chat" class="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition-all active:scale-95">
        <i class="fa-regular fa-pen-to-square text-sm"></i>
      </button>
      <button id="settingsBtn" title="Settings" class="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white transition-all active:scale-95">
        <i class="fa-solid fa-sliders text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Main Scrollable Chat Viewport -->
  <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 no-scrollbar">
    
    <!-- Hero Initial Greeting Screen -->
    <div id="heroCard" class="flex flex-col items-center justify-center min-h-[65vh] text-center space-y-4 msg-animate">
      <div class="w-20 h-20 rounded-full bg-white/5 border border-white/10 flex items-center justify-center p-1 shadow-2xl">
        <img src="ai_icon.png" alt="AI Avatar" class="w-full h-full ai-dp" onError="this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'" />
      </div>
      <div class="space-y-1">
        <h2 id="welcomeGreeting" class="text-xl font-semibold text-white tracking-tight">What's on your mind today?</h2>
        <p class="text-xs text-gray-400">Powered by RonzDavil Organisation</p>
      </div>
    </div>

    <!-- Messages List Mount -->
    <div id="messagesList" class="max-w-2xl mx-auto space-y-6 pb-6"></div>
  </main>

  <!-- Bottom Floating Composer -->
  <footer class="p-3 bg-gradient-to-t from-[#0d0d0d] via-[#0d0d0d]/95 to-transparent z-20 shrink-0">
    <div class="max-w-2xl mx-auto">
      
      <div class="composer-bg rounded-[26px] p-2 flex items-end gap-2 shadow-2xl transition-all duration-300">
        <textarea 
          id="userInput" 
          rows="1" 
          placeholder="Message Proxineon AI..." 
          class="flex-1 bg-transparent border-0 resize-none px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none max-h-36 no-scrollbar"
        ></textarea>

        <button 
          id="sendBtn" 
          class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center disabled:opacity-30 transition-all duration-200 shrink-0 mb-0.5 active:scale-90 shadow-md"
        >
          <i class="fa-solid fa-arrow-up text-sm font-bold"></i>
        </button>
      </div>

      <p class="text-[10px] text-center text-gray-500 mt-2 font-medium">Proxineon AI • Developed by RonzDavil Organisation</p>
    </div>
  </footer>

  <!-- First Time User Welcome Modal -->
  <div id="onboardingModal" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#171717] w-full max-w-sm rounded-3xl p-6 space-y-5 border border-white/10 shadow-2xl msg-animate text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-white/5 border border-white/10 flex items-center justify-center p-1">
        <img src="ai_icon.png" alt="AI Icon" class="w-full h-full ai-dp" onError="this.src='https://api.iconify.design/lucide:bot.svg?color=%23ffffff'" />
      </div>

      <div class="space-y-1">
        <h3 class="font-semibold text-white text-base">Welcome to Proxineon AI</h3>
        <p class="text-xs text-gray-400">Aapka naam kya hai?</p>
      </div>
      
      <div class="space-y-3">
        <input 
          type="text" 
          id="userNameInput" 
          placeholder="Enter your name..." 
          class="w-full px-4 py-3 rounded-2xl bg-[#212121] text-sm text-white border border-white/10 focus:outline-none focus:border-white/30 text-center"
        />
        <button id="saveNameBtn" class="w-full py-3 rounded-2xl bg-white text-black font-semibold text-xs active:scale-95 transition-all">
          Get Started
        </button>
      </div>
    </div>
  </div>

  <!-- Settings Overlay Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#171717] w-full max-w-sm rounded-3xl p-6 space-y-5 border border-white/10 shadow-2xl msg-animate">
      <div class="flex justify-between items-center">
        <h3 class="font-semibold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-user text-gray-400"></i> Profile Settings
        </h3>
        <button id="closeSettings" class="text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-base"></i></button>
      </div>
      
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="text-xs text-gray-400 font-medium">Your Name</label>
          <input 
            type="text" 
            id="settingsNameInput" 
            class="w-full px-4 py-3 rounded-2xl bg-[#212121] text-xs text-white border border-white/10 focus:outline-none focus:border-white/30"
          />
        </div>
      </div>

      <button id="saveSettings" class="w-full py-3 rounded-2xl bg-white text-black font-semibold text-xs active:scale-95 transition-all">
        Save Changes
      </button>
    </div>
  </div>

  <!-- Client-side Logic -->
  <script type="module">
    import { Groq } from 'https://esm.sh/groq-sdk';

    // HARDCODED GROQ API KEY HERE
    const GROQ_API_KEY = "gsk_..."; // Put your actual Groq API key here

    let userName = localStorage.getItem('PROXINEON_USER_NAME') || '';

    const getSystemPrompt = (name) => `You are Proxineon AI, an ultra-intelligent, highly intuitive, and versatile AI personal assistant built by RonzDavil Organisation.

Your primary duty is to support, assist, and collaborate with ${name || 'Ayan'} across code architecture, system modifications, web development, and daily tasks.

Persona & Communication Style:
1. Speak in a natural, friendly, humanized, and conversational tone with zero robotic fluff or dry academic filler.
2. Use a seamless, fluent blend of English and Roman Urdu (e.g., "Bilkul tension mat lo, ye issue hum easily fix kar lenge").
3. Adapt instantly to the user's vibe—be direct, confident, witty, and grounded.
4. When writing code or technical breakdown, be sharp, precise, and practical. Eliminate unnecessary pleasantries before presenting solutions.`;

    let messagesHistory = [
      { role: "system", content: getSystemPrompt(userName) }
    ];

    // DOM Elements
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesList = document.getElementById('messagesList');
    const heroCard = document.getElementById('heroCard');
    const chatContainer = document.getElementById('chatContainer');
    const welcomeGreeting = document.getElementById('welcomeGreeting');

    // Modals & Inputs
    const onboardingModal = document.getElementById('onboardingModal');
    const userNameInput = document.getElementById('userNameInput');
    const saveNameBtn = document.getElementById('saveNameBtn');

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    const saveSettings = document.getElementById('saveSettings');
    const settingsNameInput = document.getElementById('settingsNameInput');
    const clearChatBtn = document.getElementById('clearChatBtn');

    // Onboarding Check
    function checkUserOnboarding() {
      if (!userName) {
        onboardingModal.classList.remove('hidden');
      } else {
        welcomeGreeting.textContent = `What's on your mind today, ${userName}?`;
      }
    }

    saveNameBtn.addEventListener('click', () => {
      const enteredName = userNameInput.value.trim();
      if (enteredName) {
        userName = enteredName;
        localStorage.setItem('PROXINEON_USER_NAME', userName);
        welcomeGreeting.textContent = `What's on your mind today, ${userName}?`;
        messagesHistory[0].content = getSystemPrompt(userName);
        onboardingModal.classList.add('hidden');
      }
    });

    // Auto-expanding textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = `${Math.min(userInput.scrollHeight, 144)}px`;
    });

    // Settings Configuration
    settingsBtn.addEventListener('click', () => {
      settingsNameInput.value = userName;
      settingsModal.classList.remove('hidden');
    });

    closeSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));

    saveSettings.addEventListener('click', () => {
      const updatedName = settingsNameInput.value.trim();
      if (updatedName) {
        userName = updatedName;
        localStorage.setItem('PROXINEON_USER_NAME', userName);
        welcomeGreeting.textContent = `What's on your mind today, ${userName}?`;
        messagesHistory[0].content = getSystemPrompt(userName);
      }
      settingsModal.classList.add('hidden');
    });

    clearChatBtn.addEventListener('click', () => {
      messagesList.innerHTML = '';
      messagesHistory = [{ role: "system", content: getSystemPrompt(userName) }];
      if (heroCard) heroCard.style.display = 'flex';
    });

    // Code Enhancer: Wrap code blocks & Add Copy Button
    function processCodeBlocks(container) {
      container.querySelectorAll('pre code').forEach((block) => {
        if (block.parentElement.classList.contains('code-container')) return;

        hljs.highlightElement(block);

        const wrapper = document.createElement('div');
        wrapper.className = 'code-container';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';

        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(block.innerText).then(() => {
            copyBtn.innerHTML = '<i class="fa-solid fa-check mr-1 text-emerald-400"></i> Copied!';
            setTimeout(() => {
              copyBtn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copy';
            }, 2000);
          });
        });

        block.parentElement.parentNode.insertBefore(wrapper, block.parentElement);
        wrapper.appendChild(block.parentElement);
        wrapper.appendChild(copyBtn);
      });
    }

    // Render Message Container
    function appendMessage(role, initialText = '') {
      if (heroCard) heroCard.style.display = 'none';

      const isUser = role === 'user';
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full msg-animate`;

      const msgContainer = document.createElement('div');
      msgContainer.className = `flex items-start gap-3 max-w-[90%] sm:max-w-[85%] ${isUser ? 'flex-row-reverse' : 'flex-row'}`;

      if (!isUser) {
        const avatar = document.createElement('img');
        avatar.src = 'ai_icon.png';
        avatar.className = 'w-7 h-7 ai-dp border border-white/10 shrink-0 mt-0.5';
        avatar.onerror = () => { avatar.src = 'https://api.iconify.design/lucide:bot.svg?color=%23ffffff'; };
        msgContainer.appendChild(avatar);
      }

      const msgBubble = document.createElement('div');
      msgBubble.className = `p-3.5 rounded-2xl text-xs sm:text-sm leading-relaxed ${
        isUser 
          ? 'bg-[#2a2a2a] text-white rounded-tr-sm shadow-sm' 
          : 'text-gray-200 selectable-text space-y-2'
      }`;

      if (isUser) {
        msgBubble.textContent = initialText;
      } else if (initialText) {
        msgBubble.innerHTML = marked.parse(initialText);
        processCodeBlocks(msgBubble);
      } else {
        msgBubble.innerHTML = `
          <div class="flex items-center gap-1.5 py-1 text-gray-400">
            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></span>
            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></span>
            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full typing-dot"></span>
          </div>
        `;
      }

      msgContainer.appendChild(msgBubble);
      msgWrapper.appendChild(msgContainer);
      messagesList.appendChild(msgWrapper);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return msgBubble;
    }

    // Stream Execution
    async function handleSend() {
      const prompt = userInput.value.trim();

      if (!prompt) return;

      if (!GROQ_API_KEY || GROQ_API_KEY === "gsk_...") {
        alert("Please set your valid Groq API key inside the script variable: const GROQ_API_KEY = '...'");
        return;
      }

      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', prompt);
      messagesHistory.push({ role: 'user', content: prompt });

      const assistantBubble = appendMessage('assistant', '');

      try {
        const groq = new Groq({ 
          apiKey: GROQ_API_KEY,
          dangerouslyAllowBrowser: true 
        });

        const chatCompletion = await groq.chat.completions.create({
          messages: messagesHistory,
          model: "openai/gpt-oss-120b",
          temperature: 0.7,
          max_completion_tokens: 2048,
          top_p: 1,
          stream: true,
          reasoning_effort: "medium",
          stop: null,
          tools: [
            { type: "browser_search" },
            { type: "code_interpreter" }
          ]
        });

        let fullResponse = '';

        for await (const chunk of chatCompletion) {
          const content = chunk.choices[0]?.delta?.content || '';
          fullResponse += content;
          
          assistantBubble.innerHTML = marked.parse(fullResponse);
          processCodeBlocks(assistantBubble);

          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        messagesHistory.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        assistantBubble.textContent = `Error: ${err.message || 'Execution failed.'}`;
        assistantBubble.classList.add('text-rose-400');
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // Initialize Onboarding
    checkUserOnboarding();
  </script>
</body>
</html>
