<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Proxis - OpenSource</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg: #fcf9f6;
  --ai-bubble: #ffffff;
  --user-bubble: #2d241e;
  --text-main: #1a1614;
  --text-muted: #8c7e74;
  --accent: #d2b48c;
  --border: rgba(74, 55, 40, 0.08);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --shadow-soft: 0 10px 30px -10px rgba(74, 55, 40, 0.1);
}

* { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text-main); overflow: hidden; }

/* --- Welcome Screen Styling --- */
#welcome-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; transition: transform 0.8s var(--spring), opacity 0.5s ease;
  padding: 20px; text-align: center;
}
.welcome-logo {
  width: 100px; height: 100px; border-radius: 30px;
  box-shadow: 0 20px 40px rgba(74, 55, 40, 0.15);
  margin-bottom: 24px; animation: welcomeFloat 3s infinite ease-in-out;
}
@keyframes welcomeFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.welcome-title { font-size: 2.5rem; font-weight: 800; color: var(--user-bubble); margin: 0; letter-spacing: -1px; }
.welcome-sub { color: var(--text-muted); margin-top: 10px; max-width: 300px; line-height: 1.5; }
.start-btn {
  margin-top: 40px; padding: 18px 48px; border-radius: 100px;
  background: var(--user-bubble); color: white; border: none;
  font-weight: 700; font-size: 16px; cursor: pointer;
  transition: all 0.3s var(--spring); box-shadow: 0 10px 25px rgba(45, 36, 30, 0.2);
}
.start-btn:hover { transform: scale(1.05); background: #000; }
/* --- End Welcome Screen Styling --- */

body::before {
  content: ""; position: fixed; top: -10%; left: -10%; width: 40%; height: 40%;
  background: radial-gradient(circle, rgba(210, 180, 140, 0.15) 0%, transparent 70%);
  filter: blur(80px); z-index: -1;
}

.app { display: flex; flex-direction: column; height: 100vh; position: relative; opacity: 0; transition: opacity 0.5s ease; }
.app.active { opacity: 1; }

header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px;
  background: rgba(252, 249, 246, 0.7);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  animation: slideDown 0.8s var(--spring);
}

@keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

.brand { display: flex; gap: 12px; align-items: center; }
.brand img {
  width: 42px; height: 42px; border-radius: 14px;
  object-fit: cover; border: 2px solid #fff;
  box-shadow: 0 4px 15px rgba(74, 55, 40, 0.1);
  animation: rotateIn 1s var(--spring);
}

@keyframes rotateIn { from { transform: rotate(-20deg) scale(0); } to { transform: rotate(0) scale(1); } }

.title { font-weight: 700; font-size: 1.2rem; color: var(--user-bubble); letter-spacing: -0.5px; }

.btn-clear {
  padding: 10px 20px; border-radius: 100px;
  border: 1px solid var(--border); background: #fff;
  cursor: pointer; font-weight: 600; font-size: 13px;
  transition: all 0.3s var(--spring);
}
.btn-clear:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-color: var(--accent); }
.btn-clear:active { transform: scale(0.95); }

#chat-box {
  flex: 1; overflow-y: auto; padding: 20px 16px 200px;
  scroll-behavior: smooth;
}
.list { max-width: 750px; margin: auto; display: flex; flex-direction: column; gap: 20px; }

.msg {
  max-width: 85%; padding: 16px 22px; line-height: 1.6; font-size: 15px;
  position: relative; animation: pillPop 0.6s var(--spring) both;
}

@keyframes pillPop {
  0% { transform: scale(0.5) translateY(40px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

.msg.user {
  align-self: flex-end; background: var(--user-bubble); color: #fff;
  border-radius: 28px 28px 4px 28px;
  box-shadow: 0 15px 30px -10px rgba(45, 36, 30, 0.3);
}

.msg.ai {
  align-self: flex-start; background: var(--ai-bubble); color: var(--text-main);
  border-radius: 28px 28px 28px 4px; border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
}

.file-thumb { 
  width: 100%; max-width: 300px; border-radius: 20px; 
  margin-bottom: 12px; display: block; border: 2px solid #fff;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.file-pill {
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,0.05); padding: 12px 16px;
  border-radius: 20px; margin-bottom: 8px; font-weight: 500;
}
.msg.user .file-pill { background: rgba(255,255,255,0.1); }

.msg.thinking { background: none; border: none; box-shadow: none; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: dotWave 1.4s infinite ease-in-out; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotWave { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }

.composer-wrap {
  position: fixed; left: 0; right: 0; bottom: 30px;
  padding: 0 20px; z-index: 200; pointer-events: none;
}
.composer-inner {
  max-width: 700px; margin: auto; pointer-events: auto;
  animation: slideUp 0.8s var(--spring);
}

@keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.input-container {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
  border-radius: 40px; border: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 20px 50px -15px rgba(74, 55, 40, 0.2);
  transition: all 0.4s var(--spring);
}
.input-container:focus-within { transform: scale(1.02) translateY(-5px); border-color: var(--accent); background: #fff; }

input {
  flex: 1; border: none; outline: none; background: transparent;
  padding: 12px 10px; font-size: 16px; color: var(--text-main);
}

.send-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--user-bubble); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s var(--spring);
}
.send-btn svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2.5; }
.send-btn:hover { transform: rotate(15deg) scale(1.1); background: #000; }
.send-btn:active { transform: scale(0.9); }

.attach-label {
  width: 44px; height: 44px;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); transition: all 0.3s var(--spring);
}
.attach-label:hover { background: rgba(210, 180, 140, 0.15); color: var(--accent); transform: scale(1.1); }
.attach-label svg { width: 24px; height: 24px; }

.attachment-preview {
  display: none; background: #fff; border-radius: 20px 20px 0 0;
  padding: 12px 16px; border: 1px solid var(--border);
  border-bottom: none; margin-bottom: -20px; width: fit-content;
  margin-left: 20px; animation: pillPop 0.4s var(--spring);
}

@media(max-width: 600px) {
  .msg { max-width: 90%; }
  .composer-wrap { bottom: 15px; }
}
</style>
</head>

<body>

<!-- Welcome Screen -->
<div id="welcome-screen">
  <img src="Image.jpg" class="welcome-logo" onerror="this.src='https://placehold.co/100x100/e5d3c5/4a3728?text=Proxis'">
  <h1 class="welcome-title">Proxis</br>Ultra 1.5</h1>
  <p class="welcome-sub">The next generation multimodal assistant. Chat, analyze files, and explore. </br> </br> All writes to RonzDavil </br>Contact: ronzdavil@gmail.com</p>
  <button class="start-btn" onclick="startApp()">Start Chatting</button>
</div>

<div class="app" id="main-app">
  <header>
    <div class="brand">
      <img src="Image.jpg" onerror="this.src='https://placehold.co/80x80/e5d3c5/4a3728?text=Proxis'">
      <div class="title">Proxis</div>
    </div>
    <button id="clear" class="btn-clear">Clear Chat</button>
  </header>

  <main id="chat-box">
    <div id="messages" class="list"></div>
  </main>

  <div class="composer-wrap">
    <div class="composer-inner">
      <div id="attachment-preview" class="attachment-preview">
        <span style="font-size: 13px; font-weight: 600; color: var(--accent);" id="file-name"></span>
        <span id="remove-file" style="margin-left:10px; cursor:pointer; color:#ff4d4d; font-weight:bold; font-size: 18px;">&times;</span>
      </div>
      <div class="input-container">
        <label class="attach-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
          <input type="file" id="file-input" hidden accept="image/*,video/*,audio/*,application/pdf,text/*">
        </label>
        <input id="input" placeholder="Ask Proxis anything..." autocomplete="off">
        <button id="send" class="send-btn">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div> 
</div>

<script type="module">
import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

const SYSTEM_PROMPT = `You are Proxis, a Large Language Model by RonzDavil. Be friendly and clear. Be natural and professional. Ans shortly and clearly. Do not use your full power and potential unless user write a RonzDavil and send you. `;
const genAI = new GoogleGenerativeAI("GOOGLE_API");
const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash", systemInstruction: SYSTEM_PROMPT });

const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear");
const chatBox = document.getElementById("chat-box");
const fileInput = document.getElementById("file-input");
const preview = document.getElementById("attachment-preview");
const fileNameLabel = document.getElementById("file-name");

let memory = JSON.parse(localStorage.getItem("proxis_pill_v1") || "[]");
let busy = false;
let currentFile = null;

// Welcome Logic
window.startApp = function() {
  const ws = document.getElementById('welcome-screen');
  const app = document.getElementById('main-app');
  ws.style.opacity = '0';
  ws.style.transform = 'translateY(-100%)';
  app.classList.add('active');
  setTimeout(() => ws.style.display = 'none', 800);
  if (memory.length === 0) checkGreeting();
  render();
};

function checkGreeting() {
    if (memory.length === 0) {
        memory.push({ role: "ai", text: "Hey! I'm Proxis. How can i assist you." });
    }
}

fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        currentFile = { inlineData: { data: reader.result.split(',')[1], mimeType: file.type }, name: file.name, type: file.type, raw: reader.result };
        fileNameLabel.textContent = file.name;
        preview.style.display = "block";
    };
    reader.readAsDataURL(file);
};

document.getElementById("remove-file").onclick = () => {
    currentFile = null;
    preview.style.display = "none";
    fileInput.value = "";
};

function render() {
    messagesEl.innerHTML = "";
    memory.forEach((m, index) => {
        const d = document.createElement("div");
        d.className = "msg " + m.role;
        d.style.animationDelay = `${index * 0.05}s`;

        if (m.file) {
            if (m.file.type.startsWith('image/')) {
                const img = document.createElement('img'); img.src = m.file.raw; img.className = 'file-thumb'; d.appendChild(img);
            } else {
                const p = document.createElement('div'); p.className = 'file-pill'; p.innerHTML = `📎 ${m.file.name}`; d.appendChild(p);
            }
        }
        const t = document.createElement('div'); t.textContent = m.text; d.appendChild(t);
        messagesEl.appendChild(d);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function send() {
    if (busy || (!input.value.trim() && !currentFile)) return;
    const text = input.value.trim();
    const fileToUpload = currentFile;
    busy = true;
    input.value = ""; currentFile = null; preview.style.display = "none";
    
    memory.push({ role: "user", text: text || "Analyze this", file: fileToUpload });
    render();

    const think = document.createElement("div");
    think.className = "msg ai thinking";
    think.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    messagesEl.appendChild(think);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const parts = [];
        if (text) parts.push({ text });
        if (fileToUpload) parts.push({ inlineData: fileToUpload.inlineData });
        const result = await model.generateContent(parts);
        think.remove();
        memory.push({ role: "ai", text: result.response.text() });
    } catch (e) {
        think.remove();
        memory.push({ role: "ai", text: "Something went wrong. Please try again later." });
    }
    localStorage.setItem("proxis_pill_v1", JSON.stringify(memory));
    busy = false; render();
}

sendBtn.onclick = send;
input.onkeydown = e => { if(e.key === "Enter") send(); };
clearBtn.onclick = () => { memory = []; localStorage.removeItem("proxis_pill_v1"); checkGreeting(); render(); };

// Only check greeting here if app was already "started" (memory exists)
if (memory.length > 0) {
  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('main-app').classList.add('active');
  render();
}
</script>
</body>
</html>
